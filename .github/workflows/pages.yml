name: Website

on:
  push:
    branches: [main]
    paths:
      - 'src/Shnapp.Site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Shnapp.Site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Shnapp.Site/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Test release-feed handling
        run: npm test
      - name: Build site
        run: npm run build
      - name: Verify pages and gated media
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/download/index.html
          test -s dist/privacy/index.html

          if grep -Eq 'workflowVideoLive:[[:space:]]*true' src/config/distribution.ts; then
            test -s dist/demos/shnapp-workflow.mp4
            test -s dist/demos/shnapp-workflow-poster.jpg
            grep -Fq '/demos/shnapp-workflow.mp4' dist/index.html
          fi

          if grep -Eq '(downloadsLive|publicRepository):[[:space:]]*false' src/config/distribution.ts; then
            if grep -Fq '/releases/latest/download/' dist/download/index.html; then
              echo 'Download links appeared before the public release was enabled.' >&2
              exit 1
            fi
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/Shnapp.Site/dist

  deploy:
    name: Deploy website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
