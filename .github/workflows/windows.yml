name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Release action to run
        required: true
        type: choice
        options:
          - publish-github-release
          - refresh-release-metadata
      release_tag:
        description: Existing stable tag (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Test and build (x64)
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a release tag on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tag commit must be reachable from main.'
          }
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore core tests from lock files
        run: dotnet restore tests/Shnapp.Core.Tests/Shnapp.Core.Tests.csproj --locked-mode
      - name: Run core tests
        run: dotnet test tests/Shnapp.Core.Tests/Shnapp.Core.Tests.csproj -c Release --no-restore
      - name: Restore update tests from lock files
        run: dotnet restore tests/Shnapp.Update.Tests/Shnapp.Update.Tests.csproj --locked-mode
      - name: Run update tests
        run: dotnet test tests/Shnapp.Update.Tests/Shnapp.Update.Tests.csproj -c Release --no-restore
      - name: Restore Windows app from lock files
        run: dotnet restore src/Shnapp.App/Shnapp.App.csproj -p:Platform=x64 --locked-mode
      - name: Build Windows app
        run: dotnet build src/Shnapp.App/Shnapp.App.csproj -c Release -r win-x64 -p:Platform=x64 --no-restore
      - name: Test release signature verification
        shell: pwsh
        run: ./packaging/release/tests/Test-ReleaseSigning.ps1

  release-script-tests:
    name: Test release evidence and feed validation
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject changed build evidence
        run: bash packaging/release/tests/test-release-evidence.sh
      - name: Validate draft and public feed generation
        shell: pwsh
        run: ./packaging/release/tests/Test-ReleaseMetadata.ps1

  package:
    name: Windows distributions (${{ matrix.rid }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, release-script-tests]
    runs-on: windows-latest
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TARGET_RID: ${{ matrix.rid }}
      TARGET_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate stable release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v([1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Public release tags must look like v1.0.0; prerelease tags are not supported by this workflow.'
          }
      - name: Require trusted code signing
        shell: pwsh
        env:
          RELEASE_SIGNING_PFX_BASE64: ${{ secrets.RELEASE_SIGNING_PFX_BASE64 }}
          RELEASE_SIGNING_PFX_PASSWORD: ${{ secrets.RELEASE_SIGNING_PFX_PASSWORD }}
        run: ./packaging/release/Initialize-ReleaseSigning.ps1
      - name: Restore target architecture from lock files
        shell: pwsh
        run: |
          dotnet restore src/Shnapp.App/Shnapp.App.csproj --locked-mode "-p:Platform=$env:TARGET_PLATFORM" -p:ShnappDistribution=PortableSingleFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $launcherLock = Join-Path $env:GITHUB_WORKSPACE "src/Shnapp.Launcher/packages.$env:TARGET_RID.lock.json"
          dotnet restore src/Shnapp.Launcher/Shnapp.Launcher.csproj -r $env:TARGET_RID --locked-mode "-p:NuGetLockFilePath=$launcherLock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish portable app and checksum
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'shnapp-publish'
          $launcherDir = Join-Path $env:RUNNER_TEMP 'shnapp-launcher'
          $layoutDir = Join-Path $env:RUNNER_TEMP 'shnapp-layout'
          $assetsDir = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $version = $env:RELEASE_TAG.Substring(1)
          dotnet publish src/Shnapp.App/Shnapp.App.csproj -c Release -r $env:TARGET_RID --no-restore --self-contained true --output $publishDir "-p:Platform=$env:TARGET_PLATFORM" -p:ShnappDistribution=PortableSingleFile "-p:Version=$version" "-p:AssemblyVersion=$version.0" "-p:FileVersion=$version.0" "-p:InformationalVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $buildDir = (dotnet msbuild src/Shnapp.App/Shnapp.App.csproj -getProperty:TargetDir -p:Configuration=Release "-p:Platform=$env:TARGET_PLATFORM" "-p:RuntimeIdentifier=$env:TARGET_RID" -p:ShnappDistribution=PortableSingleFile).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $buildDir -PathType Container)) {
            throw 'Could not locate the app build output for bundled notices.'
          }
          foreach ($required in @('Shnapp.pri', 'Shnapp.deps.json', 'LICENSE')) {
            if (-not (Test-Path -LiteralPath (Join-Path $buildDir $required) -PathType Leaf)) {
              throw "App build output is missing $required."
            }
          }
          Copy-Item -LiteralPath (Join-Path $buildDir 'Shnapp.pri') -Destination $publishDir
          Copy-Item -LiteralPath (Join-Path $buildDir 'LICENSE') -Destination $publishDir
          $launcherLock = Join-Path $env:GITHUB_WORKSPACE "src/Shnapp.Launcher/packages.$env:TARGET_RID.lock.json"
          dotnet publish src/Shnapp.Launcher/Shnapp.Launcher.csproj -c Release -r $env:TARGET_RID --no-restore --output $launcherDir "-p:NuGetLockFilePath=$launcherLock" "-p:Version=$version" "-p:AssemblyVersion=$version.0" "-p:FileVersion=$version.0" "-p:InformationalVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/release/Add-ThirdPartyNotices.ps1 `
            -DepsPath (Join-Path $buildDir 'Shnapp.deps.json') `
            -OutputDirectory $publishDir
          foreach ($binary in @((Join-Path $publishDir 'Shnapp.exe'), (Join-Path $launcherDir 'Shnapp.exe'))) {
            ./packaging/release/Sign-ReleaseExecutable.ps1 `
              -Path $binary -SignToolPath $env:RELEASE_SIGNTOOL_PATH `
              -CertificateThumbprint $env:RELEASE_SIGNING_THUMBPRINT
          }
          ./packaging/release/New-PortableLayout.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -PayloadDirectory $publishDir `
            -LauncherDirectory $launcherDir `
            -OutputDirectory $layoutDir `
            -SingleFile
          New-Item -ItemType Directory -Path $assetsDir -Force | Out-Null
          $archiveName = "Shnapp-$env:TARGET_RID.zip"
          $archive = Join-Path $assetsDir $archiveName
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $layoutDir, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          ./packaging/release/Assert-ReleaseArchiveSignatures.ps1 `
            -ArchivePath $archive `
            -EntryPaths @('Shnapp.exe', "versions/$env:RELEASE_TAG/Shnapp.exe") `
            -SignToolPath $env:RELEASE_SIGNTOOL_PATH `
            -CertificateThumbprint $env:RELEASE_SIGNING_THUMBPRINT
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$archive.sha256", "$hash  $archiveName`n", [System.Text.Encoding]::ASCII)
      - name: Restore Velopack app from lock files
        shell: pwsh
        run: |
          dotnet restore src/Shnapp.App/Shnapp.App.csproj --locked-mode `
            "-p:Platform=$env:TARGET_PLATFORM" -p:ShnappDistribution=Velopack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install vpk --version 1.2.161 `
            --tool-path (Join-Path $env:RUNNER_TEMP 'velopack-tools')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish Velopack installer and update feed
        shell: pwsh
        run: |
          ./packaging/release/New-VelopackAssets.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -RuntimeIdentifier $env:TARGET_RID `
            -VpkPath (Join-Path $env:RUNNER_TEMP 'velopack-tools/vpk.exe') `
            -WorkDirectory (Join-Path $env:RUNNER_TEMP 'shnapp-velopack') `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'release-assets') `
            -SignToolPath $env:RELEASE_SIGNTOOL_PATH `
            -CertificateThumbprint $env:RELEASE_SIGNING_THUMBPRINT
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: Shnapp-${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error

  stage-release:
    name: Verify and stage draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: shnapp-release-stage-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: Shnapp-win-*
          merge-multiple: true
          path: release-assets
      - name: Verify build assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash packaging/release/verify-release-assets.sh release-assets "$RELEASE_TAG"
      - name: Generate version-specific release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          previous_release=()
          if [[ -n "$previous_tag" ]]; then
            previous_release=(-f "previous_tag_name=$previous_tag")
          fi
          gh api "repos/$GH_REPO/releases/generate-notes" -X POST \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$(git rev-parse HEAD)" \
            "${previous_release[@]}" \
            --jq .body > "$RUNNER_TEMP/generated-changes.md"
          if ! grep -Eq '^[*-] ' "$RUNNER_TEMP/generated-changes.md"; then
            echo 'No merged changes were found for this release. Add changes through reviewed pull requests before tagging.' >&2
            exit 1
          fi
          sed "s/__RELEASE_TAG__/$RELEASE_TAG/g" packaging/release/release-notes.md > "$RUNNER_TEMP/installation-notes.md"
          {
            awk '/^## / { exit } { print }' "$RUNNER_TEMP/installation-notes.md"
            sed "s/^## What's Changed$/## New in $RELEASE_TAG/" "$RUNNER_TEMP/generated-changes.md"
            printf '\n'
            awk '/^## / { started = 1 } started { print }' "$RUNNER_TEMP/installation-notes.md"
          } > "$RUNNER_TEMP/release-notes.md"
      - name: Create draft and verify uploaded assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)"
          if [[ -z "$remote_sha" ]]; then
            remote_sha="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          fi
          if [[ "$remote_sha" != "$(git rev-parse HEAD)" ]]; then
            echo 'The release tag moved after this build began.' >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != 'true' ]]; then
              echo "Release $RELEASE_TAG is already public. This workflow never overwrites published assets." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "Shnapp $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != 'true' ]]; then
            echo 'The staged release is unexpectedly public.' >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/draft-assets.json"
          while IFS= read -r name; do
            if [[ ! -f "release-assets/$name" ]]; then
              echo "The draft contains an unexpected asset: $name" >&2
              exit 1
            fi
          done < <(jq -r '.assets[].name' "$RUNNER_TEMP/draft-assets.json")
          for asset in release-assets/*; do
            name="$(basename "$asset")"
            expected_digest="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            expected_size="$(stat -c %s "$asset")"
            existing="$(jq -c --arg name "$name" '[.assets[] | select(.name == $name)]' \
              "$RUNNER_TEMP/draft-assets.json")"
            if [[ "$(jq 'length' <<< "$existing")" -eq 0 ]]; then
              gh release upload "$RELEASE_TAG" "$asset"
            elif [[ "$(jq 'length' <<< "$existing")" -ne 1 ||
                    "$(jq -r '.[0].digest' <<< "$existing")" != "$expected_digest" ||
                    "$(jq -r '.[0].size' <<< "$existing")" != "$expected_size" ]]; then
              echo "The draft asset $name differs from this build; refusing to replace it." >&2
              exit 1
            fi
          done
          mkdir -p uploaded-assets
          gh release download "$RELEASE_TAG" --dir uploaded-assets
          bash packaging/release/verify-release-assets.sh uploaded-assets "$RELEASE_TAG"
          for asset in release-assets/*; do
            cmp "$asset" "uploaded-assets/$(basename "$asset")"
          done
      - name: Generate catalog candidates from verified uploaded assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./packaging/release/New-CatalogPackages.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -AssetsDirectory uploaded-assets `
            -OutputDirectory catalog-candidates
      - name: Save catalog candidates for review
        uses: actions/upload-artifact@v7
        with:
          name: Catalog-candidates-${{ github.ref_name }}
          path: catalog-candidates/
          if-no-files-found: error
      - name: Record exact successful build evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash packaging/release/release-evidence.sh write release-assets \
            "$RELEASE_TAG" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" release-evidence
      - name: Save release evidence for publication
        uses: actions/upload-artifact@v7
        with:
          name: Release-evidence-${{ github.ref_name }}
          path: release-evidence/
          if-no-files-found: error

  publish-release:
    name: Publish release and current-version feed
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.operation == 'publish-github-release' || inputs.operation == 'refresh-release-metadata')
    runs-on: ubuntu-latest
    environment: release-publication
    concurrency:
      group: shnapp-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - name: Verify release assets and publication prerequisites
        id: preflight
        shell: bash
        env:
          RELEASE_SETTINGS_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Provide a stable v1.0.0-style release tag.' >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null ||
             ! git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}^{commit}" origin/main; then
            echo 'Release tag commit must be reachable from main.' >&2
            exit 1
          fi
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          remote_sha="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)"
          if [[ -z "$remote_sha" ]]; then
            remote_sha="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          fi
          if [[ "$remote_sha" != "$tag_sha" ]]; then
            echo 'The release tag moved after checkout; refusing publication.' >&2
            exit 1
          fi
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [[ "$RELEASE_OPERATION" == 'publish-github-release' && "$is_draft" != 'true' ]]; then
            echo 'The release must exist as a draft before publication.' >&2
            exit 1
          fi
          if [[ "$RELEASE_OPERATION" == 'refresh-release-metadata' && "$is_draft" != 'false' ]]; then
            echo 'Metadata refresh requires an already public release.' >&2
            exit 1
          fi
          mkdir -p downloaded-assets
          gh release download "$RELEASE_TAG" --dir downloaded-assets
          bash packaging/release/verify-release-assets.sh downloaded-assets "$RELEASE_TAG"
          if [[ "$RELEASE_OPERATION" == 'publish-github-release' ]]; then
            if [[ -z "$RELEASE_SETTINGS_TOKEN" ]]; then
              echo 'Set RELEASE_SETTINGS_TOKEN with repository Administration:read before publication.' >&2
              exit 1
            fi
            if [[ "$(GH_TOKEN="$RELEASE_SETTINGS_TOKEN" gh api "repos/$GH_REPO/immutable-releases" \
              -H 'X-GitHub-Api-Version: 2026-03-10' --jq .enabled)" != 'true' ]]; then
              echo 'Enable immutable releases before publishing.' >&2
              exit 1
            fi
            runs="$(gh api "repos/$GH_REPO/actions/workflows/windows.yml/runs?event=push&branch=$RELEASE_TAG&status=success&per_page=100")"
            run_id="$(jq -er --arg tag "$RELEASE_TAG" --arg sha "$tag_sha" '
              [.workflow_runs[] |
               select(.event == "push" and .conclusion == "success" and
                      .head_branch == $tag and .head_sha == $sha and
                      (.path | split("@")[0]) == ".github/workflows/windows.yml")] |
              max_by(.id) | .id
            ' <<< "$runs")"
            gh run download "$run_id" --name "Release-evidence-$RELEASE_TAG" --dir release-evidence
            bash packaging/release/release-evidence.sh verify downloaded-assets \
              "$RELEASE_TAG" "$tag_sha" "$run_id" release-evidence
          fi
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/release-body.md"
          if (( $(wc -c < "$RUNNER_TEMP/release-body.md") > 30000 )); then
            echo 'Release notes exceed the website feed limit of 30,000 UTF-8 bytes.' >&2
            exit 1
          fi
          if ! awk -v tag="$RELEASE_TAG" '
            $0 == "## New in " tag { in_changes = 1; next }
            in_changes && /^## / { exit }
            in_changes && /^[*-] / { found = 1 }
            END { exit !found }
          ' "$RUNNER_TEMP/release-body.md"; then
            echo "Release notes need a '## New in $RELEASE_TAG' section with at least one change." >&2
            exit 1
          fi
          if [[ "$RELEASE_OPERATION" == 'publish-github-release' ]]; then
            github_api_status() {
              curl --silent --show-error --location \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --output "$2" --write-out '%{http_code}' \
                "https://api.github.com/repos/$GH_REPO/$1"
            }
            require_newer_than() {
              local existing_tag="$1" source="$2"
              if [[ ! "$existing_tag" =~ ^v[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "$source has an unexpected tag: $existing_tag" >&2
                exit 1
              fi
              if [[ "$RELEASE_TAG" == "$existing_tag" ||
                    "$(printf '%s\n' "$existing_tag" "$RELEASE_TAG" | LC_ALL=C sort -V | tail -n 1)" != "$RELEASE_TAG" ]]; then
                echo "Release $RELEASE_TAG must be newer than $source $existing_tag." >&2
                exit 1
              fi
            }
            latest_status="$(github_api_status 'releases/latest' "$RUNNER_TEMP/latest-release.json")"
            case "$latest_status" in
              200)
                latest_tag="$(jq -er '.tag_name' "$RUNNER_TEMP/latest-release.json")"
                require_newer_than "$latest_tag" 'latest public release'
                if ! git merge-base --is-ancestor "refs/tags/${latest_tag}^{commit}" "$tag_sha"; then
                  echo "Release $RELEASE_TAG must contain the source of $latest_tag." >&2
                  exit 1
                fi
                ;;
              404) ;;
              *) echo "Could not read the latest public release (HTTP $latest_status)." >&2; exit 1 ;;
            esac
            feed_status="$(github_api_status 'contents/latest.json?ref=release-metadata' "$RUNNER_TEMP/current-release-feed-response.json")"
            case "$feed_status" in
              200)
                if ! jq -e '.type == "file" and .encoding == "base64" and (.content | type == "string")' \
                  "$RUNNER_TEMP/current-release-feed-response.json" >/dev/null; then
                  echo 'Current release metadata is not a readable file.' >&2
                  exit 1
                fi
                jq -er '.content' "$RUNNER_TEMP/current-release-feed-response.json" |
                  base64 --decode > "$RUNNER_TEMP/current-release-feed.json"
                if ! jq -e '(.schemaVersion == 1 or .schemaVersion == 2) and (.version | type == "string") and (.tag | type == "string")' \
                  "$RUNNER_TEMP/current-release-feed.json" >/dev/null; then
                  echo 'Current release metadata has an invalid schema.' >&2
                  exit 1
                fi
                feed_tag="$(jq -er '.tag' "$RUNNER_TEMP/current-release-feed.json")"
                feed_version="$(jq -er '.version' "$RUNNER_TEMP/current-release-feed.json")"
                if [[ "$feed_tag" != "v$feed_version" ]]; then
                  echo 'Current release metadata tag and version disagree.' >&2
                  exit 1
                fi
                require_newer_than "$feed_tag" 'current website release'
                ;;
              404) ;;
              *) echo "Could not read current release metadata (HTTP $feed_status)." >&2; exit 1 ;;
            esac
          fi
      - name: Prevalidate the draft website feed
        if: inputs.operation == 'publish-github-release'
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --json tagName,url,isDraft,isPrerelease,publishedAt,body,assets > draft-details.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/release/Write-ReleaseMetadata.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -Repository $env:GH_REPO `
            -ReleaseJsonPath draft-details.json `
            -AssetsDirectory downloaded-assets `
            -DraftPreflight
      - name: Publish the reviewed draft
        id: publication
        if: inputs.operation == 'publish-github-release'
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/final-draft-assets.json"
          awk '{ name = $2; sub(/^\*/, "", name); print $1 "  " name }' \
            release-evidence/assets.sha256 | LC_ALL=C sort -k2 > "$RUNNER_TEMP/build-digests.txt"
          jq -r '.assets[] | select(.digest | test("^sha256:[0-9a-f]{64}$")) |
            "\(.digest[7:])  \(.name)"' "$RUNNER_TEMP/final-draft-assets.json" |
            LC_ALL=C sort -k2 > "$RUNNER_TEMP/draft-digests.txt"
          if ! cmp "$RUNNER_TEMP/build-digests.txt" "$RUNNER_TEMP/draft-digests.txt"; then
            echo 'Draft assets changed during publication preflight.' >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Publish verified release metadata for the website
        id: metadata
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --json tagName,url,isDraft,isPrerelease,publishedAt,body,assets > release-details.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/release/Write-ReleaseMetadata.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -Repository $env:GH_REPO `
            -ReleaseJsonPath release-details.json `
            -AssetsDirectory downloaded-assets `
            -OutputPath release-metadata/latest.json
          ./packaging/release/Publish-ReleaseMetadata.ps1 `
            -FilePath release-metadata/latest.json `
            -Repository $env:GH_REPO
      - name: Check public release and website feed health
        if: >-
          always() && steps.preflight.outcome == 'success' &&
          (steps.publication.outcome == 'success' || inputs.operation == 'refresh-release-metadata')
        shell: bash
        env:
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != 'false' ]]; then
            echo 'The release is not public.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq .immutable)" != 'true' ]]; then
            echo "### $RELEASE_TAG is public but release immutability is missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$METADATA_OUTCOME" != 'success' ]] ||
             ! feed="$(gh api "repos/$GH_REPO/contents/latest.json?ref=release-metadata" \
            --jq .content | base64 --decode)" ||
             [[ "$(jq -r '.tag // empty' <<< "$feed")" != "$RELEASE_TAG" ]]; then
            {
              echo "### $RELEASE_TAG is public, but the website feed needs repair"
              echo 'Run refresh-release-metadata for this tag after resolving the metadata error.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### $RELEASE_TAG is public and the website feed matches" >> "$GITHUB_STEP_SUMMARY"

  scoop-release:
    name: Verify Scoop update
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'publish-github-release' &&
      needs.publish-release.result == 'success'
    needs: publish-release
    uses: ./.github/workflows/scoop.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets:
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  winget-release:
    name: Verify WinGet candidate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'publish-github-release' &&
      needs.publish-release.result == 'success'
    needs: publish-release
    uses: ./.github/workflows/winget.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}

  chocolatey-release:
    name: Submit Chocolatey package
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'publish-github-release' &&
      needs.publish-release.result == 'success'
    needs: publish-release
    uses: ./.github/workflows/chocolatey.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
