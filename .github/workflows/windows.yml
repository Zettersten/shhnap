name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Release action to run
        required: true
        type: choice
        options:
          - publish-github-release
          - build-store-msix
          - verify-chocolatey
          - publish-chocolatey
      release_tag:
        description: Existing stable tag (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Test and build (x64)
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a release tag on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tag commit must be reachable from main.'
          }
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore core tests from lock files
        run: dotnet restore tests/Shnapp.Core.Tests/Shnapp.Core.Tests.csproj --locked-mode
      - name: Run core tests
        run: dotnet test tests/Shnapp.Core.Tests/Shnapp.Core.Tests.csproj -c Release --no-restore
      - name: Restore update tests from lock files
        run: dotnet restore tests/Shnapp.Update.Tests/Shnapp.Update.Tests.csproj --locked-mode
      - name: Run update tests
        run: dotnet test tests/Shnapp.Update.Tests/Shnapp.Update.Tests.csproj -c Release --no-restore
      - name: Restore Windows app from lock files
        run: dotnet restore src/Shnapp.App/Shnapp.App.csproj -p:Platform=x64 --locked-mode
      - name: Build Windows app
        run: dotnet build src/Shnapp.App/Shnapp.App.csproj -c Release -r win-x64 -p:Platform=x64 --no-restore

  package:
    name: Portable ZIP (${{ matrix.rid }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TARGET_RID: ${{ matrix.rid }}
      TARGET_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate stable release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v([1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Public release tags must look like v1.0.0; prerelease tags are not supported by this workflow.'
          }
      - name: Restore target architecture from lock files
        shell: pwsh
        run: |
          dotnet restore src/Shnapp.App/Shnapp.App.csproj --locked-mode "-p:Platform=$env:TARGET_PLATFORM"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $launcherLock = Join-Path $env:GITHUB_WORKSPACE "src/Shnapp.Launcher/packages.$env:TARGET_RID.lock.json"
          dotnet restore src/Shnapp.Launcher/Shnapp.Launcher.csproj -r $env:TARGET_RID --locked-mode "-p:NuGetLockFilePath=$launcherLock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish portable app and checksum
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'shnapp-publish'
          $launcherDir = Join-Path $env:RUNNER_TEMP 'shnapp-launcher'
          $layoutDir = Join-Path $env:RUNNER_TEMP 'shnapp-layout'
          $assetsDir = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $version = $env:RELEASE_TAG.Substring(1)
          dotnet publish src/Shnapp.App/Shnapp.App.csproj -c Release -r $env:TARGET_RID --no-restore --self-contained true --output $publishDir "-p:Platform=$env:TARGET_PLATFORM" "-p:Version=$version" "-p:AssemblyVersion=$version.0" "-p:FileVersion=$version.0" "-p:InformationalVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $launcherLock = Join-Path $env:GITHUB_WORKSPACE "src/Shnapp.Launcher/packages.$env:TARGET_RID.lock.json"
          dotnet publish src/Shnapp.Launcher/Shnapp.Launcher.csproj -c Release -r $env:TARGET_RID --no-restore --output $launcherDir "-p:NuGetLockFilePath=$launcherLock" "-p:Version=$version" "-p:AssemblyVersion=$version.0" "-p:FileVersion=$version.0" "-p:InformationalVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/release/Add-ThirdPartyNotices.ps1 `
            -DepsPath (Join-Path $publishDir 'Shnapp.deps.json') `
            -OutputDirectory $publishDir
          ./packaging/release/New-PortableLayout.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -PayloadDirectory $publishDir `
            -LauncherDirectory $launcherDir `
            -OutputDirectory $layoutDir
          New-Item -ItemType Directory -Path $assetsDir -Force | Out-Null
          $archiveName = "Shnapp-$env:TARGET_RID.zip"
          $archive = Join-Path $assetsDir $archiveName
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $layoutDir, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$archive.sha256", "$hash  $archiveName`n", [System.Text.Encoding]::ASCII)
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: Shnapp-${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error

  stage-release:
    name: Verify and stage draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: Shnapp-win-*
          merge-multiple: true
          path: release-assets
      - name: Verify build assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash packaging/release/verify-release-assets.sh release-assets "$RELEASE_TAG"
      - name: Create draft and verify uploaded assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. This workflow never overwrites assets." >&2
            exit 1
          fi
          sed "s/__RELEASE_TAG__/$RELEASE_TAG/g" packaging/release/release-notes.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag \
            --title "Shnapp $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != 'true' ]]; then
            echo 'The staged release is unexpectedly public.' >&2
            exit 1
          fi
          mkdir -p uploaded-assets
          gh release download "$RELEASE_TAG" --dir uploaded-assets
          bash packaging/release/verify-release-assets.sh uploaded-assets "$RELEASE_TAG"
          for asset in release-assets/*; do
            cmp "$asset" "uploaded-assets/$(basename "$asset")"
          done
      - name: Generate catalog candidates from verified uploaded assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./packaging/release/New-CatalogPackages.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -AssetsDirectory uploaded-assets `
            -OutputDirectory catalog-candidates
      - name: Save catalog candidates for review
        uses: actions/upload-artifact@v7
        with:
          name: Catalog-candidates-${{ github.ref_name }}
          path: catalog-candidates/
          if-no-files-found: error

  store-package:
    name: Store MSIX (${{ matrix.rid }})
    if: >-
      always() && !cancelled() &&
      (((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
         needs.verify.result == 'success') &&
        vars.STORE_IDENTITY_NAME != '' &&
        vars.STORE_IDENTITY_PUBLISHER != '' &&
        vars.STORE_PUBLISHER_DISPLAY_NAME != '') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'build-store-msix'))
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      TARGET_RID: ${{ matrix.rid }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_IDENTITY_PUBLISHER: ${{ vars.STORE_IDENTITY_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: microsoft/setup-msbuild@v2
      - name: Require a reviewed stable tag and Partner Center identity
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Provide an existing stable release tag.'
          }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Store tag commit must be reachable from main.' }
          foreach ($value in @($env:STORE_IDENTITY_NAME, $env:STORE_IDENTITY_PUBLISHER, $env:STORE_PUBLISHER_DISPLAY_NAME)) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw 'Set the three Partner Center identity repository variables before building an MSIX.'
            }
          }
      - name: Set Partner Center identity and package version
        shell: pwsh
        run: |
          ./packaging/store/Set-StoreManifest.ps1 `
            -ManifestPath src/Shnapp.App/Package.appxmanifest `
            -ReleaseTag $env:RELEASE_TAG `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -IdentityPublisher $env:STORE_IDENTITY_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME
      - name: Prepare exact runtime and NuGet notices for the MSIX
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $probeDir = Join-Path $env:RUNNER_TEMP 'shnapp-store-notice-probe'
          dotnet restore src/Shnapp.App/Shnapp.App.csproj --locked-mode "-p:Platform=$env:TARGET_PLATFORM"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/Shnapp.App/Shnapp.App.csproj -c Release -r $env:TARGET_RID --no-restore --self-contained true --output $probeDir "-p:Platform=$env:TARGET_PLATFORM" "-p:Version=$version" "-p:AssemblyVersion=$version.0" "-p:FileVersion=$version.0" "-p:InformationalVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/release/Add-ThirdPartyNotices.ps1 `
            -DepsPath (Join-Path $probeDir 'Shnapp.deps.json') `
            -OutputDirectory "src/Shnapp.App/obj/$env:TARGET_PLATFORM/DistributionNotices"
      - name: Build unsigned Store submission MSIX
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          # MSBuild concatenates the package name to AppxPackageDir; it must end in a separator.
          $packageDir = (Join-Path $env:GITHUB_WORKSPACE 'store-packages') + [System.IO.Path]::DirectorySeparatorChar
          msbuild src/Shnapp.App/Shnapp.App.csproj /restore /p:RestoreLockedMode=true /p:Configuration=Release "/p:Platform=$env:TARGET_PLATFORM" "/p:RuntimeIdentifier=$env:TARGET_RID" /p:SelfContained=true /p:ShnappDistribution=Store /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never /p:UapAppxPackageBuildMode=StoreUpload "/p:AppxPackageDir=$packageDir" "/p:Version=$version" "/p:AssemblyVersion=$version.0" "/p:FileVersion=$version.0" "/p:InformationalVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem -Path $packageDir -Recurse -File -Filter '*.msix')
          if ($packages.Count -ne 1) { throw "Expected one MSIX for $env:TARGET_RID; found $($packages.Count)." }
          Copy-Item -LiteralPath $packages[0].FullName -Destination (Join-Path $env:GITHUB_WORKSPACE "Shnapp-$env:TARGET_RID.msix")
          $uploads = @(Get-ChildItem -Path $packageDir -Recurse -File -Filter '*.msixupload')
          if ($uploads.Count -ne 1) { throw "Expected one MSIX upload file for $env:TARGET_RID; found $($uploads.Count)." }
          Copy-Item -LiteralPath $uploads[0].FullName -Destination (Join-Path $env:GITHUB_WORKSPACE "Shnapp-$env:TARGET_RID.msixupload")
      - name: Check out Store validation tools
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          path: store-validation-tools
          sparse-checkout: packaging/store/Assert-StorePackage.ps1
          sparse-checkout-cone-mode: false
      - name: Validate Store package identity and upload contents
        shell: pwsh
        run: |
          ./store-validation-tools/packaging/store/Assert-StorePackage.ps1 `
            -PackagePath "Shnapp-$env:TARGET_RID.msix" `
            -UploadPath "Shnapp-$env:TARGET_RID.msixupload" `
            -ReleaseTag $env:RELEASE_TAG `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -IdentityPublisher $env:STORE_IDENTITY_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME `
            -ProcessorArchitecture $env:TARGET_PLATFORM
      - name: Upload Store candidate for manual Partner Center submission
        uses: actions/upload-artifact@v7
        with:
          name: Store-${{ matrix.rid }}
          path: |
            Shnapp-${{ matrix.rid }}.msix
            Shnapp-${{ matrix.rid }}.msixupload
          if-no-files-found: error

  publish-release:
    name: Publish reviewed draft GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-github-release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - name: Verify draft release and publish
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Provide a stable v1.0.0-style release tag.' >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null ||
             ! git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}^{commit}" origin/main; then
            echo 'Release tag commit must be reachable from main.' >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != 'true' ]]; then
            echo 'The release must exist as a draft before publication.' >&2
            exit 1
          fi
          mkdir -p downloaded-assets
          gh release download "$RELEASE_TAG" --dir downloaded-assets
          bash packaging/release/verify-release-assets.sh downloaded-assets "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false

  chocolatey-verify:
    name: Pack and test Chocolatey
    needs: publish-release
    if: >-
      always() && !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.operation == 'publish-github-release' && needs.publish-release.result == 'success') ||
       inputs.operation == 'verify-chocolatey' ||
       inputs.operation == 'publish-chocolatey')
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - name: Require a public stable release from main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Provide a stable v1.0.0-style release tag.'
          }
          $tagCommit = git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The release tag does not exist.' }
          git merge-base --is-ancestor $tagCommit HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Release tag commit must be reachable from main.' }
          $releaseJson = gh release view $env:RELEASE_TAG --json isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw 'The GitHub release does not exist.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) { throw 'Chocolatey requires a public stable GitHub release.' }
          $expected = @(
            'Shnapp-win-x64.zip', 'Shnapp-win-x64.zip.sha256',
            'Shnapp-win-arm64.zip', 'Shnapp-win-arm64.zip.sha256'
          ) | Sort-Object
          $actual = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -ne 0) {
            throw 'The GitHub release must contain exactly two ZIPs and their checksum files.'
          }
      - name: Download immutable release assets
        shell: pwsh
        run: |
          gh release download $env:RELEASE_TAG --dir release-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate and pack Chocolatey package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./packaging/release/New-CatalogPackages.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -AssetsDirectory release-assets `
            -OutputDirectory catalog-candidates
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'chocolatey-package'
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          choco pack catalog-candidates/chocolatey/shnapp.nuspec --outputdirectory $packageDir --limit-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $env:RELEASE_TAG.Substring(1)
          $package = Join-Path $packageDir "shnapp.$version.nupkg"
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) { throw "Missing $package" }
          $found = choco info shnapp --source $packageDir --limit-output
          if ($LASTEXITCODE -ne 0 -or ($found | Out-String).Trim() -ne "shnapp|$version") {
            throw 'Chocolatey cannot read the generated package.'
          }
      - name: Install and uninstall the package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.Substring(1)
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'chocolatey-package'
          choco install shnapp --version $version --source $packageDir --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $appDir = Join-Path $env:ChocolateyInstall 'lib/shnapp/tools/app'
          foreach ($required in @('Shnapp.exe', 'Shnapp.pri', 'LICENSE', 'THIRD_PARTY_NOTICES.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $appDir $required) -PathType Leaf)) {
              throw "Installed Shnapp is missing $required."
            }
          }
          choco uninstall shnapp --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath (Join-Path $env:ChocolateyInstall 'lib/shnapp')) {
            throw 'Chocolatey left the Shnapp package directory after uninstall.'
          }
      - name: Save tested Chocolatey package
        uses: actions/upload-artifact@v7
        with:
          name: Chocolatey-${{ inputs.release_tag }}
          path: chocolatey-package/*.nupkg
          if-no-files-found: error

  chocolatey-publish:
    name: Submit Chocolatey package
    if: >-
      always() && !cancelled() &&
      needs.chocolatey-verify.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.operation == 'publish-github-release' || inputs.operation == 'publish-chocolatey')
    needs: chocolatey-verify
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Chocolatey-${{ inputs.release_tag }}
          path: chocolatey-package
      - name: Push tested package to Chocolatey Community
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
            throw 'Set the CHOCOLATEY_API_KEY Actions repository secret before submission.'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $package = Join-Path $env:GITHUB_WORKSPACE "chocolatey-package/shnapp.$version.nupkg"
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) { throw "Missing $package" }
          choco push $package --source https://push.chocolatey.org/ --key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
